# Local PostgreSQL for development and tests. In production, point DATABASE_URL at a managed database.
# The password below only works from this computer (the port is bound to 127.0.0.1).
name: jerseyorbit

services:
  db:
    image: postgres:16-alpine
    container_name: jerseyorbit-db
    environment:
      POSTGRES_USER: jerseyorbit
      POSTGRES_PASSWORD: jerseyorbit_local
      POSTGRES_DB: jerseyorbit
    ports:
      - '127.0.0.1:5438:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jerseyorbit -d jerseyorbit']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
