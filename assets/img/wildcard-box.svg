    <path d="M431 68C457 66 489 44 480 29 469 14 437 40 431 68Z" fill="#9fe446" stroke="#7cc22f" stroke-width="3"/>
    <circle cx="431" cy="68" r="11" fill="#b4f55f" stroke="#7cc22f" stroke-width="3"/>
